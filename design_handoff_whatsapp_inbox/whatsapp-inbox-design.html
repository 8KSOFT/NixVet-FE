<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>NixVetApp — WhatsApp</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand-50:#eefaf4;--brand-100:#d3f0e2;--brand-500:#0e9e6e;--brand-600:#0c8a5f;--brand-700:#0a7350;
  --sidebar:#0e9e6e;--sidebar-dark:#0b8760;
  --ink:#1a2420;--ink-2:#5a6a63;--ink-3:#8a9791;
  --line:#e2e8e5;--line-2:#eef2f0;
  --bg:#f6f8f7;--card:#ffffff;
  --warn:#d97706;--warn-bg:#fef3e2;
  --blue:#2563eb;--blue-bg:#eaf1ff;
  --radius:10px;--radius-lg:14px;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#d7ded9;border-radius:8px}
</style></head>
<body><div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState} = React;

const Icon = ({name, size=18, color='currentColor', strokeWidth=1.8}) => {
  const paths = {
    logo: <><circle cx="12" cy="6" r="2.4"/><circle cx="18" cy="12" r="2.4"/><circle cx="12" cy="18" r="2.4"/><circle cx="6" cy="12" r="2.4"/></>,
    search: <><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
    bell: <><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 21a2 2 0 0 0 4 0"/></>,
    plus: <><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
    grid: <><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></>,
    calendar: <><rect x="3" y="4.5" width="18" height="16" rx="2"/><line x1="3" y1="9.5" x2="21" y2="9.5"/><line x1="8" y1="2.5" x2="8" y2="6.5"/><line x1="16" y1="2.5" x2="16" y2="6.5"/></>,
    users: <><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15.5 14a5.2 5.2 0 0 1 5.5 5.6"/></>,
    user: <><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5c0-4.1 3.3-7 7.5-7s7.5 2.9 7.5 7"/></>,
    file: <><path d="M6 3h8l5 5v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5"/></>,
    pill: <><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-30 12 12)"/><line x1="9.5" y1="8.5" x2="14.5" y2="15.5"/></>,
    flask: <><path d="M9 3h6"/><path d="M10 3v6l-5.5 9.5A1.5 1.5 0 0 0 5.8 21h12.4a1.5 1.5 0 0 0 1.3-2.5L14 9V3"/></>,
    bed: <><path d="M2 18v-6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v6"/><path d="M2 18v2"/><path d="M22 18v2"/><path d="M2 12V6"/><rect x="4" y="8" width="7" height="4" rx="1"/></>,
    chart: <><line x1="4" y1="21" x2="4" y2="10"/><line x1="12" y1="21" x2="12" y2="5"/><line x1="20" y1="21" x2="20" y2="14"/></>,
    chevronDown: <polyline points="6 9 12 15 18 9"/>,
    chevronLeft: <polyline points="15 18 9 12 15 6"/>,
    message: <path d="M4 4h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H8l-4 4V5a1 1 0 0 1 1-1z"/>,
    bot: <><rect x="4" y="8" width="16" height="12" rx="2.5"/><circle cx="9" cy="14" r="1.4"/><circle cx="15" cy="14" r="1.4"/><line x1="12" y1="4" x2="12" y2="8"/><circle cx="12" cy="3" r="1"/></>,
    tag: <><path d="M20 12l-8 8-9-9V4h7z"/><circle cx="7" cy="7" r="1.3"/></>,
    check: <polyline points="20 6 9 17 4 12"/>,
    archive: <><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><line x1="10" y1="12" x2="14" y2="12"/></>,
    bulb: <><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2.2h5.2c0-1 .4-1.7 1-2.2A6 6 0 0 0 12 3z"/></>,
    send: <><line x1="21" y1="3" x2="10" y2="14"/><polygon points="21 3 14.5 21 10.5 14 3.5 10 21 3"/></>,
    help: <><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.8 1c0 1.7-2.3 2-2.3 3.5"/><line x1="12" y1="17" x2="12" y2="17"/></>,
    settings: <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.6 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.6 1z"/></>,
    clock: <><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></>,
    prescription: <><path d="M5 3v18"/><path d="M5 3h6a4 4 0 0 1 0 8H5"/><path d="M11 11l7 10"/></>
  };
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">{paths[name]}</svg>;
};

const NAV = [
  {icon:'grid', label:'Dashboard'}, {icon:'calendar', label:'Agenda'}, {icon:'users', label:'Pacientes'},
  {icon:'user', label:'Responsáveis'}, {icon:'file', label:'Prontuário'}, {icon:'prescription', label:'Prescrição'},
  {icon:'flask', label:'Exames'}, {icon:'bed', label:'Internações'}, {icon:'chart', label:'Financeiro', chevron:true},
  {icon:'message', label:'WhatsApp', active:true}, {icon:'bot', label:'Chatbot / IA'},
];

const STATS = [
  {icon:'clock', label:'Aguardando resposta', value:'0', tone:'ink'},
  {icon:'user', label:'Aguardando responsável', value:'0', tone:'ink'},
  {icon:'check', label:'Encerradas hoje', value:'1', tone:'brand'},
  {icon:'clock', label:'Tempo médio resposta', value:'0s', tone:'ink'},
];

const BADGES = {
  human: {text:'Atendimento humano', fg:'#b45309', bg:'#fef3e2'},
  scheduled: {text:'Consulta agendada', fg:'#0a7350', bg:'#e3f7ee'},
  closed: {text:'Atendimento encerrado', fg:'#2563eb', bg:'#eaf1ff'},
  other: {text:'Outro', fg:'#5a6a63', bg:'#f0f3f1'},
};

const CONVERSATIONS = [
  {name:'Marcos Vinícius Lima', phone:'5511976321098', time:'há 13 horas', badge:null},
  {name:'Fernanda Souza', phone:'11982114432', time:'há 13 horas', badge:null},
  {name:'Patrícia Gomes', phone:'5511921083345', time:'há um dia', badge:'scheduled'},
  {name:'Eduardo Carvalho', phone:'5511954217789', time:'há um dia', badge:'other', human:true, active:true},
  {name:'Juliana Ribeiro', phone:'5511965432210', time:'há um dia', badge:'scheduled'},
  {name:'Marcos Vinícius Lima', phone:'5511976321098', time:'há um dia', badge:'closed'},
  {name:'Fernanda Souza', phone:'5511982114432', time:'há um dia', badge:null},
];

const MESSAGES = [
  {from:'them', text:'Boa tarde, o Rex vomitou de novo hoje, o que eu faço?', time:'11/08 23:31'},
  {from:'us', text:'Boa tarde, Eduardo. Ele está se alimentando normalmente ou também recusou comida?', time:'11/08 23:34'},
  {from:'them', text:'Recusou a ração da manhã', time:'11/08 23:37'},
  {from:'us', text:'Entendi. Pra segurança, vamos encaixar uma avaliação hoje ainda. Consigo às 17h, pode ser?', time:'11/08 23:40'},
  {from:'them', text:'Pode sim, obrigado!', time:'11/08 23:43'},
];

function Badge({kind}){
  const b = BADGES[kind]; if(!b) return null;
  return <span style={{display:'inline-flex',alignItems:'center',gap:5,padding:'3px 9px',borderRadius:999,fontSize:12,fontWeight:600,color:b.fg,background:b.bg}}>
    <Icon name="tag" size={11} strokeWidth={2.2} color={b.fg}/>{b.text}
  </span>;
}

function StatCard({icon, label, value, tone}){
  return (
    <div style={{flex:1,background:'var(--card)',border:'1px solid var(--line)',borderRadius:'var(--radius-lg)',padding:'18px 20px',display:'flex',flexDirection:'column',gap:10}}>
      <div style={{display:'flex',alignItems:'center',gap:8,color:'var(--ink-2)',fontSize:13,fontWeight:500}}>
        <span style={{display:'flex',alignItems:'center',justifyContent:'center',width:26,height:26,borderRadius:8,background:tone==='brand'?'var(--brand-100)':'var(--line-2)',color:tone==='brand'?'var(--brand-700)':'var(--ink-2)'}}>
          <Icon name={icon} size={14} strokeWidth={2}/>
        </span>
        {label}
      </div>
      <div style={{fontSize:28,fontWeight:700,color:tone==='brand'?'var(--brand-600)':'var(--ink)',letterSpacing:'-0.02em'}}>{value}</div>
    </div>
  );
}

function ActionButton({icon, label, primary, danger}){
  const base = {display:'flex',alignItems:'center',gap:7,padding:'9px 14px',borderRadius:'var(--radius)',fontSize:13.5,fontWeight:600,border:'1px solid',transition:'background .15s,border-color .15s'};
  const style = primary
    ? {...base, background:'var(--brand-600)', borderColor:'var(--brand-600)', color:'#fff'}
    : danger
    ? {...base, background:'#fff', borderColor:'#f3d0c8', color:'#c0522f'}
    : {...base, background:'#fff', borderColor:'var(--line)', color:'var(--ink)'};
  return <button style={style} onMouseEnter={e=>{if(!primary)e.currentTarget.style.background='var(--line-2)'; else e.currentTarget.style.background='var(--brand-700)'}} onMouseLeave={e=>{e.currentTarget.style.background=primary?'var(--brand-600)':'#fff'}}>
    <Icon name={icon} size={15} strokeWidth={2}/>{label}
  </button>;
}

function Sidebar(){
  return (
    <div style={{width:248,flexShrink:0,background:'var(--sidebar)',color:'#fff',display:'flex',flexDirection:'column',padding:'20px 14px'}}>
      <div style={{display:'flex',alignItems:'center',gap:9,padding:'0 8px 22px',fontWeight:700,fontSize:17}}>
        <Icon name="logo" size={20}/> NixVetApp
      </div>
      <button style={{display:'flex',alignItems:'center',justifyContent:'center',gap:7,background:'rgba(255,255,255,.14)',border:'1px solid rgba(255,255,255,.25)',color:'#fff',borderRadius:10,padding:'9px',fontSize:13.5,fontWeight:600,marginBottom:18}}>
        <Icon name="plus" size={15}/> Novo
      </button>
      <div style={{display:'flex',flexDirection:'column',gap:2}}>
        {NAV.map((n,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 10px',borderRadius:9,fontSize:13.5,fontWeight:500,background:n.active?'rgba(255,255,255,.16)':'transparent',color:n.active?'#fff':'rgba(255,255,255,.85)',cursor:'pointer'}}>
            <Icon name={n.icon} size={16} strokeWidth={2}/>
            <span style={{flex:1}}>{n.label}</span>
            {n.chevron && <Icon name="chevronDown" size={13}/>}
          </div>
        ))}
      </div>
      <div style={{marginTop:'auto',display:'flex',flexDirection:'column',gap:2,paddingTop:16,borderTop:'1px solid rgba(255,255,255,.15)'}}>
        <div style={{fontSize:10.5,fontWeight:700,letterSpacing:'.06em',color:'rgba(255,255,255,.55)',padding:'6px 10px'}}>ADMIN</div>
        {[{icon:'help',label:'Ajuda'},{icon:'settings',label:'Configurações'}].map((n,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 10px',borderRadius:9,fontSize:13.5,fontWeight:500,color:'rgba(255,255,255,.85)'}}>
            <Icon name={n.icon} size={16} strokeWidth={2}/>{n.label}
          </div>
        ))}
      </div>
    </div>
  );
}

function TopBar(){
  return (
    <div style={{display:'flex',alignItems:'center',gap:14,padding:'14px 28px',borderBottom:'1px solid var(--line)',background:'#fff'}}>
      <div style={{flex:1,display:'flex',alignItems:'center',gap:9,background:'var(--line-2)',border:'1px solid var(--line)',borderRadius:10,padding:'8px 12px',maxWidth:340,color:'var(--ink-3)'}}>
        <Icon name="search" size={15}/><span style={{fontSize:13.5,flex:1}}>Buscar</span>
        <span style={{fontSize:11,fontWeight:600,background:'#fff',border:'1px solid var(--line)',borderRadius:5,padding:'1px 6px',color:'var(--ink-2)'}}>Ctrl+K</span>
      </div>
      <button style={{width:34,height:34,borderRadius:9,border:'1px solid var(--line)',background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-2)'}}><Icon name="plus" size={16}/></button>
      <div style={{display:'flex',background:'var(--line-2)',borderRadius:9,padding:3,fontSize:12.5,fontWeight:600}}>
        {['PT','EN','ES'].map((l,i)=>(
          <span key={l} style={{padding:'5px 10px',borderRadius:7,background:i===0?'#fff':'transparent',boxShadow:i===0?'0 1px 2px rgba(0,0,0,.08)':'none',color:i===0?'var(--ink)':'var(--ink-3)'}}>{l}</span>
        ))}
      </div>
      <button style={{width:34,height:34,borderRadius:9,border:'1px solid var(--line)',background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-2)'}}><Icon name="bell" size={16}/></button>
      <div style={{display:'flex',alignItems:'center',gap:9,paddingLeft:6}}>
        <span style={{fontSize:13.5,color:'var(--ink-2)'}}>Olá, <b style={{color:'var(--ink)'}}>Administrador</b></span>
        <div style={{width:32,height:32,borderRadius:'50%',background:'var(--brand-600)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12.5,fontWeight:700}}>AD</div>
      </div>
    </div>
  );
}

function StatsRow(){
  return <div style={{display:'flex',gap:14,padding:'20px 28px 6px'}}>{STATS.map((s,i)=><StatCard key={i} {...s}/>)}</div>;
}

function ConversationRow({c, selected}){
  return (
    <div style={{padding:'12px 14px',borderRadius:'var(--radius)',border:'1px solid '+(selected?'var(--brand-500)':'transparent'),background:selected?'var(--brand-50)':'transparent',cursor:'pointer',display:'flex',flexDirection:'column',gap:5}}>
      <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between'}}>
        <span style={{fontSize:14,fontWeight:600}}>{c.name}</span>
      </div>
      <span style={{fontSize:12.5,color:'var(--ink-3)'}}>{c.phone} · {c.time}</span>
      {c.human && <span style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:12.5,fontWeight:600,color:'var(--warn)'}}><Icon name="user" size={12} color="var(--warn)"/>Atendimento humano</span>}
      {c.badge && <div><Badge kind={c.badge}/></div>}
    </div>
  );
}

function ConversationList(){
  const [tab,setTab] = useState('Ativas');
  return (
    <div style={{width:340,flexShrink:0,borderRight:'1px solid var(--line)',display:'flex',flexDirection:'column',background:'#fff'}}>
      <div style={{padding:'18px 18px 12px',display:'flex',flexDirection:'column',gap:12}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <span style={{fontWeight:700,fontSize:15}}>Conversas</span>
          <div style={{display:'flex',background:'var(--line-2)',borderRadius:9,padding:3,fontSize:12.5,fontWeight:600}}>
            {['Ativas','Arquivadas'].map(t=>(
              <span key={t} onClick={()=>setTab(t)} style={{padding:'6px 12px',borderRadius:7,cursor:'pointer',background:tab===t?'var(--brand-600)':'transparent',color:tab===t?'#fff':'var(--ink-2)'}}>{t}</span>
            ))}
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',border:'1px solid var(--line)',borderRadius:'var(--radius)',padding:'9px 12px',fontSize:13.5,color:'var(--ink-2)'}}>
          Todas as classificações <Icon name="chevronDown" size={14}/>
        </div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'0 10px 14px',display:'flex',flexDirection:'column',gap:3}}>
        {CONVERSATIONS.map((c,i)=><ConversationRow key={i} c={c} selected={c.active}/>)}
      </div>
    </div>
  );
}

function Bubble({m}){
  const mine = m.from==='us';
  return (
    <div style={{display:'flex',justifyContent:mine?'flex-end':'flex-start'}}>
      <div style={{maxWidth:480,display:'flex',flexDirection:'column',gap:4,alignItems:mine?'flex-end':'flex-start'}}>
        <div style={{padding:'12px 15px',borderRadius:mine?'14px 14px 3px 14px':'14px 14px 14px 3px',background:mine?'var(--brand-600)':'var(--line-2)',color:mine?'#fff':'var(--ink)',fontSize:14,lineHeight:1.45}}>{m.text}</div>
        <span style={{fontSize:11.5,color:'var(--ink-3)',padding:'0 4px'}}>{m.time}</span>
      </div>
    </div>
  );
}

function ChatPanel(){
  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',background:'#fbfcfb'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,padding:'16px 24px',borderBottom:'1px solid var(--line)',background:'#fff'}}>
        <div style={{width:38,height:38,borderRadius:'50%',background:'var(--brand-100)',color:'var(--brand-700)',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:14}}>EC</div>
        <div style={{display:'flex',flexDirection:'column',gap:3}}>
          <span style={{fontWeight:700,fontSize:14.5}}>Eduardo Carvalho</span>
          <div style={{display:'flex',gap:6}}><Badge kind="human"/><Badge kind="other"/></div>
        </div>
        <div style={{flex:1}}/>
        <ActionButton icon="bot" label="Retomar Bot"/>
        <ActionButton icon="tag" label="Classificar"/>
        <ActionButton icon="check" label="Encerrar"/>
        <ActionButton icon="archive" label="Arquivar"/>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:'26px 32px',display:'flex',flexDirection:'column',gap:16}}>
        {MESSAGES.map((m,i)=><Bubble key={i} m={m}/>)}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:10,padding:'16px 24px',borderTop:'1px solid var(--line)',background:'#fff'}}>
        <div style={{flex:1,border:'1px solid var(--line)',borderRadius:999,padding:'11px 18px',fontSize:14,color:'var(--ink-3)'}}>Digite a mensagem...</div>
        <button style={{width:42,height:42,borderRadius:'50%',border:'1px solid var(--line)',background:'#fff',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--ink-2)'}}><Icon name="bulb" size={17}/></button>
        <button style={{width:42,height:42,borderRadius:'50%',border:'none',background:'var(--brand-600)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff'}}><Icon name="send" size={17}/></button>
      </div>
    </div>
  );
}

function App(){
  return (
    <div style={{display:'flex',height:'100vh',width:'100vw',overflow:'hidden'}}>
      <Sidebar/>
      <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>
        <TopBar/>
        <StatsRow/>
        <div style={{padding:'18px 28px 0'}}><h1 style={{margin:0,fontSize:22,fontWeight:700,display:'flex',alignItems:'center',gap:9}}><Icon name="message" size={22} color="var(--brand-600)"/>WhatsApp</h1></div>
        <div style={{flex:1,display:'flex',padding:'14px 28px 28px',gap:0,minHeight:0}}>
          <div style={{flex:1,display:'flex',border:'1px solid var(--line)',borderRadius:'var(--radius-lg)',overflow:'hidden',minHeight:0}}>
            <ConversationList/>
            <ChatPanel/>
          </div>
        </div>
      </div>
      <button style={{position:'fixed',right:28,bottom:24,display:'flex',alignItems:'center',gap:8,padding:'12px 18px',borderRadius:999,border:'none',background:'var(--brand-600)',color:'#fff',fontWeight:700,fontSize:13.5,boxShadow:'0 6px 18px rgba(14,158,110,.35)'}}>
        <Icon name="check" size={15}/> Configuração 25%
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
