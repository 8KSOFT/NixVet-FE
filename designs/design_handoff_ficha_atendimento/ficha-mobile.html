<!-- @dsCard group="Mobile" viewport="411x900" name="Ficha de Atendimento Mobile" subtitle="Seções organizadas por hierarquia" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
*{margin:0;box-sizing:border-box}
body{background:#2b2b2b;display:flex;justify-content:center;padding:24px 0;font-family:var(--font-sans)}
.phone{width:411px;background:#f6f8f7;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;min-height:900px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;background:#f6f8f7}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);font-weight:600}
.crumb svg{width:13px;height:13px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.scroll{flex:1;overflow-y:auto;padding-bottom:110px}
.wrap{padding:0 16px}
.head-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;margin-bottom:16px}
.head-id{display:flex;align-items:center;gap:11px}
.doc-ic{width:38px;height:38px;border-radius:10px;background:var(--brand-50);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.doc-ic svg{width:18px;height:18px;color:var(--brand-700)}
.pet-name{font-size:18px;font-weight:800;color:var(--ink)}
.status-open{font-size:11px;font-weight:700;color:#0a7350;background:#e3f7ee;padding:3px 10px;border-radius:999px;margin-left:6px}
.pet-sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.meta-row{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}
.meta-pill{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;font-size:11.5px;color:var(--ink-2);font-weight:600}
.meta-pill svg{width:12px;height:12px;color:var(--ink-3)}
.actions-row{display:flex;gap:9px;margin-top:14px}
.btn{flex:1;border:none;border-radius:9px;font-size:12.5px;font-weight:700;padding:10px;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--brand-600);color:#fff}
.btn-outline{background:#fff;color:var(--ink);border:1.5px solid var(--line)}

.tabs2{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;margin-bottom:16px;scrollbar-width:none}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 .t{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:#eef1ef;white-space:nowrap}
.tabs2 .t.on{background:var(--brand-600);color:#fff}
.tabs2 .t svg{width:13px;height:13px}

.section{margin-bottom:16px}
.section-eyebrow{font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;padding-left:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink);margin-bottom:6px}
textarea,input,select{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:13.5px;font-family:var(--font-sans);color:var(--ink);resize:vertical}
.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.ai-btn{display:inline-flex;align-items:center;gap:6px;background:var(--brand-50);color:var(--brand-700);border:1px solid var(--brand-100);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:700}
.ai-btn svg{width:13px;height:13px}

.exam-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.exam-head{display:flex;align-items:center;justify-content:space-between;background:var(--brand-50);padding:12px 16px;border-bottom:1px solid var(--brand-100)}
.exam-head h3{font-size:13px;font-weight:700;color:var(--brand-700);display:flex;align-items:center;gap:7px}
.exam-head h3 svg{width:14px;height:14px}
.exam-head svg.chev{width:14px;height:14px;color:var(--brand-600)}
.exam-body{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.unit-input{position:relative}
.unit-input input{padding-right:38px}
.unit-input span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--ink-3);font-weight:600}

.diag-card{background:linear-gradient(180deg,var(--brand-50),#fff);border:1.5px solid var(--brand-100);border-radius:14px;padding:16px}
.diag-card label{color:var(--brand-700);display:flex;align-items:center;gap:6px}
.diag-card label svg{width:14px;height:14px}

.notes-card{background:#fbfcfb;border:1px dashed var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.notes-card:last-child{margin-bottom:0}
.notes-card label{color:var(--ink-2);display:flex;align-items:center;gap:5px;font-weight:600}
.notes-card label svg{width:12px;height:12px;color:var(--ink-3)}
.notes-card textarea{background:#fff}

.sticky-bar{position:fixed;bottom:0;left:0;right:0;max-width:411px;margin:0 auto;background:#fff;border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px}
</style></head><body>
<div class="phone">
<div class="topbar"><div class="crumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 6l-6 6 6 6"/></svg>Voltar</div><div class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></div></div>
<div class="scroll">
<div class="wrap">

<div class="head-card">
<div class="head-id">
<div class="doc-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v5h5"/></svg></div>
<div><span class="pet-name">Duke</span><span class="status-open">Aberto</span><div class="pet-sub">Ficha de atendimento</div></div>
</div>
<div class="meta-row">
<div class="meta-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-9.3-9A5 5 0 0 1 12 6a5 5 0 0 1 9.3 6c-2.3 4.5-9.3 9-9.3 9z"/></svg>Golden Retriever</div>
<div class="meta-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/></svg>11/08/2026</div>
<div class="meta-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Dr. Rafael</div>
</div>
</div>

<div class="tabs2">
<div class="t on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h4l2 8 4-16 2 8h8"/></svg>Clínico</div>
<div class="t">Prescrições</div>
<div class="t">Exames</div>
<div class="t">Vacinas</div>
<div class="t">Anexos</div>
</div>

<div class="section">
<div class="section-eyebrow">Motivo da consulta</div>
<div class="card">
<div class="field"><label>Queixa principal</label><input value="Consulta de urgência - ingestão de objeto"></div>
<div class="field"><label>Anamnese</label><textarea rows="3">Tutora relata que Duke mastigou e possivelmente ingeriu parte de um brinquedo de borracha.</textarea></div>
<div class="ai-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg>Formatar com IA</div>
</div>
</div>

<div class="section">
<div class="section-eyebrow">Exame físico</div>
<div class="exam-card">
<div class="exam-head"><h3><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-9.3-9A5 5 0 0 1 12 6a5 5 0 0 1 9.3 6c-2.3 4.5-9.3 9-9.3 9z"/></svg>Sinais vitais</h3><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 15l6-6 6 6"/></svg></div>
<div class="exam-body">
<div><label>Peso</label><div class="unit-input"><input value="31,70"><span>kg</span></div></div>
<div><label>Temp.</label><div class="unit-input"><input value="38,8"><span>°C</span></div></div>
<div><label>FC</label><div class="unit-input"><input value="100"><span>bpm</span></div></div>
<div><label>FR</label><div class="unit-input"><input value="26"><span>mpm</span></div></div>
<div><label>TPC</label><div class="unit-input"><input placeholder="—"><span>s</span></div></div>
<div><label>Hidratação</label><select><option>—</option></select></div>
</div>
</div>
</div>

<div class="section">
<div class="section-eyebrow">Avaliação</div>
<div class="diag-card">
<label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>Diagnóstico presuntivo</label>
<textarea rows="3">Suspeita de ingestão de corpo estranho, sem sinais de obstrução no momento.</textarea>
</div>
</div>

<div class="section">
<div class="section-eyebrow">Complementar</div>
<div class="notes-card"><label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>Notas da equipe (interno)</label><textarea rows="2" placeholder="Visível apenas para a equipe"></textarea></div>
<div class="notes-card"><label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.4 8.5 8.5 0 0 1-4.3-1.1L3 20l1.2-4.8A8.4 8.4 0 1 1 21 11.5z"/></svg>Observações para o tutor</label><textarea rows="2">Orientado retorno imediato caso apresente vômito, apatia ou dor abdominal.</textarea></div>
</div>

</div>
</div>
<div class="sticky-bar">
<button class="btn btn-outline"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Fechar</button>
<button class="btn btn-primary"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/></svg>Salvar</button>
</div>
</div>
</body></html>
