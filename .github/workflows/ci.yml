# Portão de integração (E04 do plano de prontidão — docs/prontidao-enterprise
# no repositório do backend). Os três jobs são obrigatórios na branch
# protection de `main`: em 17/09/2026 o front já estava limpo em `tsc` e em
# `eslint` (0 erros), então não há razão para portão informativo aqui.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  # Produção é manual (E09 / ADR-002): promover é uma decisão, depois de
  # validar em homologação o mesmo commit que o push verde já mandou lá.
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Digite "producao" para deployar main em nixvetapp.com.br'
        required: true
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx eslint . --max-warnings=20

  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # `scripts/check-build-env.mjs` (prebuild) confere que toda NEXT_PUBLIC_*
      # usada está declarada como ARG no Dockerfile — não exige valor. Os
      # valores públicos têm default no next.config.mjs; o build de CI não
      # publica nada, só prova que compila.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # Portão de deploy (E04, opção b) — ver o workflow do backend. A 8khost
  # segue fazendo o build; este job só a chama depois dos três checks.
  #
  # Desde E09 o push verde deploya HOMOLOGAÇÃO (`nixvetapp-front-hml`);
  # produção (`nixvetapp-front`) sai só pelo `workflow_dispatch` com a
  # palavra "producao". Mesmo mecanismo do backend.
  deploy-hml:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    needs: [typecheck, lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy de homologação na 8khost
        env:
          URL: ${{ secrets.EIGHTK_HML_WEBHOOK_URL }}
          TOKEN: ${{ secrets.EIGHTK_HML_WEBHOOK_TOKEN }}
          SHA: ${{ github.sha }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          test -n "$URL" && test -n "$TOKEN"
          body=$(jq -cn --arg ref "refs/heads/main" --arg sha "$SHA" --arg msg "$MSG" \
            '{ref:$ref, after:$sha, head_commit:{id:$sha, message:$msg}}')
          sig="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$TOKEN" | sed 's/^.* //')"
          resp=$(curl -sS -w '\n%{http_code}' -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H 'x-github-event: push' \
            -H "x-github-delivery: actions-${GITHUB_RUN_ID}" \
            -H "x-hub-signature-256: $sig" \
            --data "$body")
          echo "$resp"
          [ "$(echo "$resp" | tail -1)" = "201" ] || [ "$(echo "$resp" | tail -1)" = "200" ]

  deploy-prd:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirmar == 'producao' && github.ref == 'refs/heads/main'
    needs: [typecheck, lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy de PRODUÇÃO na 8khost
        env:
          URL: ${{ secrets.EIGHTK_WEBHOOK_URL }}
          TOKEN: ${{ secrets.EIGHTK_WEBHOOK_TOKEN }}
          SHA: ${{ github.sha }}
          MSG: "promoção manual para produção por ${{ github.actor }}"
        run: |
          set -euo pipefail
          test -n "$URL" && test -n "$TOKEN"
          body=$(jq -cn --arg ref "refs/heads/main" --arg sha "$SHA" --arg msg "$MSG" \
            '{ref:$ref, after:$sha, head_commit:{id:$sha, message:$msg}}')
          sig="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$TOKEN" | sed 's/^.* //')"
          resp=$(curl -sS -w '\n%{http_code}' -X POST "$URL" \
            -H 'Content-Type: application/json' \
            -H 'x-github-event: push' \
            -H "x-github-delivery: actions-${GITHUB_RUN_ID}" \
            -H "x-hub-signature-256: $sig" \
            --data "$body")
          echo "$resp"
          [ "$(echo "$resp" | tail -1)" = "201" ] || [ "$(echo "$resp" | tail -1)" = "200" ]
